[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "psychopomp"
version = "0.1.0"
description = "A torch.compile backend that compiles PyTorch models to luminal via ONNX"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
]

[tool.maturin]
manifest-path = "rust_psychopomp/Cargo.toml"
python-source = "python"
module-name = "psychopomp._psychopomp_rs"
features = ["pyo3/extension-module"]
